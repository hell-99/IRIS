name: Keep Streamlit App Alive

on:
  schedule:
    - cron: '*/30 * * * *'  # every 30 minutes
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping IRIS app
        continue-on-error: true
        run: curl -s -o /dev/null -w "HTTP %{http_code}" --max-time 30 -L -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" https://iris-hell99.streamlit.app || true
